<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAME 관리자 (데모)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F0EA;color:#1F241E;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px}
a{color:#2E3A2C}
button,input,select,textarea{font-family:inherit;font-size:17px}
.demo{background:#8A6C3E;color:#fff;text-align:center;font-size:14px;padding:10px 16px;line-height:1.5}
.top{background:#2E3A2C;color:#F7F5EF;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:24px}
.top a,.top button{color:#F7F5EF;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 16px;font-size:15px;text-decoration:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.tabs button{min-height:56px;border:0;border-radius:14px;background:#fff;color:#2E3A2C;font-weight:500;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabs button.on{background:#2E3A2C;color:#fff}
.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:18px}
.panel h2{margin:0 0 16px;font-size:20px}
label{display:block;font-weight:500;margin:16px 0 8px}
input[type=text],input[type=password],textarea,select{width:100%;min-height:54px;border:1px solid #CFC9BC;border-radius:12px;padding:12px 14px;background:#FCFBF8;color:#1F241E}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.big{width:100%;min-height:58px;border:0;border-radius:14px;background:#2E3A2C;color:#fff;font-weight:700;cursor:pointer;margin-top:20px}
.big:disabled{opacity:.5}
.ghost{min-height:46px;padding:0 16px;border:1px solid #CFC9BC;border-radius:12px;background:#fff;color:#2E3A2C;cursor:pointer}
.danger{min-height:46px;padding:0 16px;border:1px solid #C9A3A3;border-radius:12px;background:#fff;color:#8E2C2C;cursor:pointer}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;border:2px dashed #BDB6A6;border-radius:14px;background:#FAF8F3;color:#5E6B57;cursor:pointer;text-align:center;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{display:none}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #ECE8DF}
.item img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:#E6E1D5}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:14px;color:#5E6B57}
.row{display:flex;gap:8px;flex-wrap:wrap}
.price{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #ECE8DF}
.price input{min-height:48px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F241E;color:#fff;padding:14px 22px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hidden{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wk{position:relative;border-radius:12px;overflow:hidden;background:#E6E1D5}
.wk img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.wk div{padding:8px 10px;font-size:14px;background:#fff}
.wk .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px;background:#fff}
.wk .acts button{min-height:40px;border-radius:10px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="demo">관리자 기능 <b>체험용 데모</b>예요. 올린 내용은 지금 쓰는 이 기기의 브라우저에만 저장돼요.</div>

<!-- 로그인 -->
<section id="login" class="wrap" style="max-width:440px;padding-top:56px">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-family:'Cormorant Garamond',serif;font-size:40px">NAME</div>
    <div style="color:#5E6B57;margin-top:4px">사장님 전용 관리자</div>
  </div>
  <form class="panel" id="loginForm">
    <label for="uid">아이디</label>
    <input id="uid" type="text" autocomplete="off" value="demo">
    <label for="upw">비밀번호</label>
    <input id="upw" type="password" autocomplete="off" value="demo">
    <p style="font-size:14px;color:#5E6B57;margin:12px 0 0">데모라서 아무 값이나 넣고 로그인하면 돼요.</p>
    <button class="big" type="submit">로그인</button>
  </form>
  <p style="text-align:center"><a href="../">← 홈페이지로 돌아가기</a></p>
</section>

<!-- 관리 화면 -->
<section id="app" class="hidden">
  <div class="top">
    <span class="logo">NAME <span style="font-family:'Noto Sans KR';font-size:14px;opacity:.8">관리자</span></span>
    <div class="row"><a href="../" target="_blank">홈페이지 보기</a><button type="button" id="logout">로그아웃</button></div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button type="button" data-tab="news" class="on">소식 글쓰기</button>
      <button type="button" data-tab="works">포트폴리오</button>
      <button type="button" data-tab="prices">메뉴·가격</button>
    </div>

    <!-- 소식 -->
    <div id="tab-news">
      <form class="panel" id="newsForm">
        <h2 id="newsTitle">새 소식 올리기</h2>
        <label class="photo" id="newsPhoto">
          <input type="file" accept="image/*" id="newsFile">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
          <span>사진 선택 (선택 사항)</span>
        </label>
        <label for="newsT">제목</label>
        <input id="newsT" type="text" placeholder="예) 12월 휴무 안내" required>
        <label for="newsB">내용</label>
        <textarea id="newsB" placeholder="손님께 알리고 싶은 내용을 적어주세요." required></textarea>
        <button class="big" type="submit" id="newsSubmit">등록하기</button>
        <button class="ghost hidden" type="button" id="newsCancel" style="width:100%;margin-top:10px">수정 취소</button>
      </form>
      <div class="panel"><h2>올린 소식</h2><div id="newsList"></div></div>
    </div>

    <!-- 포트폴리오 -->
    <div id="tab-works" class="hidden">
      <form class="panel" id="workForm">
        <h2 id="workTitle">시술 사진 올리기</h2>
        <label class="photo" id="workPhoto" style="min-height:220px">
          <input type="file" accept="image/*" id="workFile">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
          <span>사진 선택</span>
        </label>
        <label for="workT">시술 이름</label>
        <input id="workT" type="text" placeholder="예) 볼륨 C컬 펌" required>
        <label for="workC">분류</label>
        <select id="workC"><option value="hair">헤어</option><option value="brow">눈썹</option></select>
        <button class="big" type="submit" id="workSubmit">포트폴리오에 올리기</button>
        <button class="ghost hidden" type="button" id="workCancel" style="width:100%;margin-top:10px">수정 취소</button>
      </form>
      <div class="panel"><h2>포트폴리오 사진 <span id="workCount" style="font-size:15px;color:#5E6B57;font-weight:400"></span></h2><div id="workList" class="grid2"></div><p id="workEmpty" style="color:#5E6B57;margin:0">아직 사진이 없어요.</p></div>
    </div>

    <!-- 가격 -->
    <div id="tab-prices" class="hidden">
      <form class="panel" id="priceForm">
        <h2>메뉴·가격 수정</h2>
        <p style="margin:0 0 8px;color:#5E6B57;font-size:15px">가격을 적고 저장하면 홈페이지에 바로 바뀌어요. 비워두면 [가격]으로 보여요.</p>
        <div id="priceList"></div>
        <button class="big" type="submit">가격 저장하기</button>
      </form>
    </div>

    <div style="text-align:center;margin-top:28px">
      <button class="ghost" type="button" id="resetDemo">데모 처음 상태로 되돌리기</button>
      <p style="font-size:14px;color:#5E6B57;margin:8px 0 0">체험하며 바꾼 글, 사진, 가격이 모두 원래대로 돌아가요.</p>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="../store.js?v=3"></script>
<script>
var $=function(id){return document.getElementById(id)};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2000);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// 로그인 (데모)
function enter(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); renderAll(); }
if(sessionStorage.getItem('salonAdmin')) enter();
$('loginForm').addEventListener('submit',function(e){e.preventDefault();sessionStorage.setItem('salonAdmin','1');enter();});
$('logout').addEventListener('click',function(){sessionStorage.removeItem('salonAdmin');location.reload();});

// 탭
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x===b)});
  ['news','works','prices'].forEach(function(t){$('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab)});});

// 사진 줄이기 (최대 1200px, JPEG)
function shrink(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var m=1200,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78));};img.src=r.result;};r.readAsDataURL(file);}
function bindPhoto(inputId,boxId,holder){$(inputId).addEventListener('change',function(){var f=this.files[0];if(!f)return;shrink(f,function(d){holder.data=d;var box=$(boxId),old=box.querySelector('img');if(old)old.remove();var im=document.createElement('img');im.src=d;im.alt='선택한 사진';box.appendChild(im);});});}
function clearPhoto(boxId,holder){holder.data=null;var old=$(boxId).querySelector('img');if(old)old.remove();}

// 소식
var newsPic={data:null},editing=null;
bindPhoto('newsFile','newsPhoto',newsPic);
function src(u){return u&&u.indexOf('data:')!==0?'../'+u:u}
function renderNews(){var d=SalonStore.load();d.posts.forEach(function(p){p.img=src(p.img)});$('newsList').innerHTML=d.posts.length?d.posts.map(function(p){return '<div class="item">'+(p.img?'<img src="'+p.img+'" alt="">':'<img alt="" style="visibility:hidden">')+'<div class="t"><b>'+esc(p.title)+'</b><span>'+esc(p.date)+'</span></div><div class="row"><button class="ghost" type="button" data-edit="'+p.id+'">수정</button><button class="danger" type="button" data-del="'+p.id+'">삭제</button></div></div>';}).join(''):'<p style="color:#5E6B57;margin:0">아직 올린 소식이 없어요.</p>';}
function resetNews(){editing=null;$('newsForm').reset();clearPhoto('newsPhoto',newsPic);$('newsTitle').textContent='새 소식 올리기';$('newsSubmit').textContent='등록하기';$('newsCancel').classList.add('hidden');}
$('newsForm').addEventListener('submit',function(e){e.preventDefault();var d=SalonStore.load(),t=$('newsT').value.trim(),b=$('newsB').value.trim();if(!t||!b)return;
  if(editing){var p=d.posts.find(function(x){return x.id===editing});p.title=t;p.body=b;if(newsPic.data)p.img=newsPic.data;}
  else d.posts.unshift({id:Date.now(),title:t,body:b,img:newsPic.data,date:new Date().toLocaleDateString('ko-KR')});
  if(!SalonStore.save(d))return toast('저장 공간이 부족해요. 사진을 줄여주세요.');
  toast(editing?'수정했어요':'등록했어요');resetNews();renderNews();});
$('newsCancel').addEventListener('click',resetNews);
$('newsList').addEventListener('click',function(e){var d=SalonStore.load(),ed=e.target.dataset.edit,del=e.target.dataset.del;
  if(ed){var p=d.posts.find(function(x){return x.id==ed});editing=p.id;$('newsT').value=p.title;$('newsB').value=p.body;clearPhoto('newsPhoto',newsPic);if(p.img){var im=document.createElement('img');im.src=src(p.img);im.alt='';$('newsPhoto').appendChild(im);}
    $('newsTitle').textContent='소식 수정하기';$('newsSubmit').textContent='수정 완료';$('newsCancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
  if(del&&confirm('이 소식을 정말 삭제할까요?')){d.posts=d.posts.filter(function(x){return x.id!=del});SalonStore.save(d);renderNews();toast('삭제했어요');}});

// 포트폴리오 (기존 사진 포함 전체 수정·삭제)
var workPic={data:null},workEditing=null;
bindPhoto('workFile','workPhoto',workPic);
function renderWorks(){var d=SalonStore.load();$('workEmpty').classList.toggle('hidden',d.works.length>0);$('workCount').textContent=d.works.length+'장';
  $('workList').innerHTML=d.works.map(function(w){return '<div class="wk"><img src="'+src(w.img)+'" alt="'+esc(w.title)+'"><div>'+esc(w.title)+' · '+(w.cat==='hair'?'헤어':'눈썹')+'</div><div class="acts"><button class="ghost" type="button" data-edit="'+w.id+'">수정</button><button class="danger" type="button" data-del="'+w.id+'">삭제</button></div></div>';}).join('');}
function resetWork(){workEditing=null;$('workForm').reset();clearPhoto('workPhoto',workPic);$('workTitle').textContent='시술 사진 올리기';$('workSubmit').textContent='포트폴리오에 올리기';$('workCancel').classList.add('hidden');}
$('workForm').addEventListener('submit',function(e){e.preventDefault();var d=SalonStore.load(),t=$('workT').value.trim();if(!t)return;
  if(workEditing){var w=d.works.find(function(x){return x.id===workEditing});w.title=t;w.cat=$('workC').value;if(workPic.data)w.img=workPic.data;}
  else{if(!workPic.data)return toast('사진을 먼저 선택해 주세요');d.works.unshift({id:Date.now(),title:t,cat:$('workC').value,img:workPic.data});}
  if(!SalonStore.save(d))return toast('저장 공간이 부족해요.');toast(workEditing?'수정했어요':'포트폴리오에 올렸어요');resetWork();renderWorks();});
$('workCancel').addEventListener('click',resetWork);
$('workList').addEventListener('click',function(e){var d=SalonStore.load(),ed=e.target.dataset.edit,del=e.target.dataset.del;
  if(ed){var w=d.works.find(function(x){return x.id==ed});workEditing=w.id;$('workT').value=w.title;$('workC').value=w.cat;clearPhoto('workPhoto',workPic);var im=document.createElement('img');im.src=src(w.img);im.alt='';$('workPhoto').appendChild(im);
    $('workTitle').textContent='사진 정보 수정하기';$('workSubmit').textContent='수정 완료';$('workCancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
  if(del&&confirm('이 사진을 정말 삭제할까요?')){d.works=d.works.filter(function(x){return x.id!=del});SalonStore.save(d);if(workEditing==del)resetWork();renderWorks();toast('삭제했어요');}});

// 가격
function renderPrices(){var d=SalonStore.load();$('priceList').innerHTML=SalonStore.MENUS.map(function(m){return '<h3 style="margin:22px 0 4px;font-size:18px">'+m.ko+'</h3>'+m.items.map(function(it){var k=m.en+'|'+it[0];return '<div class="price"><label for="p-'+esc(k)+'" style="margin:0">'+it[0]+'</label><input type="text" id="p-'+esc(k)+'" data-k="'+esc(k)+'" value="'+esc(d.prices[k]||'')+'" placeholder="예) 50,000원"></div>';}).join('');}).join('');}
$('priceForm').addEventListener('submit',function(e){e.preventDefault();var d=SalonStore.load();[].forEach.call(document.querySelectorAll('#priceList input'),function(i){var v=i.value.trim();if(v)d.prices[i.dataset.k]=v;else delete d.prices[i.dataset.k];});SalonStore.save(d);toast('가격을 저장했어요');});

$('resetDemo').addEventListener('click',function(){if(confirm('체험하며 바꾼 내용을 모두 처음 상태로 되돌릴까요?')){SalonStore.reset();resetNews();resetWork();renderAll();toast('처음 상태로 되돌렸어요');}});
function renderAll(){renderNews();renderWorks();renderPrices();}
</script>
</body>
</html>
